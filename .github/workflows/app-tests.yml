name: App Tests

on:
  pull_request:
    branches: [ "main" ]

jobs:
  app-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install PyJWT

      - name: Run pytest (app)
        run: |
          cd backend
          pytest tests/test_app.py -v
