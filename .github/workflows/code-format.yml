name: Code Format

on:
    push:
      branches: []
    pull_request:
        branches: []

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - run: pip install black
      - run: black --check backend
